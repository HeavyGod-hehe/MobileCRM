<!DOCTYPE html>
<html lang="en" data-theme="default-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activation Required — Phone Reseller CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="text-slate-100 min-h-screen antialiased flex items-center justify-center p-4">
  <div class="bg-mesh" aria-hidden="true"></div>
  <div class="glass-card rounded-2xl p-8 w-full max-w-lg relative z-10">
    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center mx-auto mb-5 shadow-lg">
      <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-white text-center mb-2">Activation Required</h1>
    <p class="text-slate-400 text-sm text-center mb-6">
      This copy of Phone Reseller CRM is not activated on this computer.
      Send your Hardware ID to your vendor to receive an Activation Key.
    </p>

    <div class="mb-5">
      <label class="block text-xs font-medium text-slate-400 mb-1.5">Your Hardware ID</label>
      <div class="flex gap-2">
        <input type="text" id="hardware-id" readonly value="{{ hardware_id }}"
               class="input-field font-mono text-sm flex-1 cursor-text">
        <button type="button" id="btn-copy-hw" class="btn btn-ghost shrink-0">Copy</button>
      </div>
    </div>

    <form id="activation-form" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5" for="activation-key">Serial / Activation Key</label>
        <input type="text" id="activation-key" class="input-field font-mono text-sm"
               placeholder="Paste your serial key from vendor" autocomplete="off" required>
      </div>
      <p id="activation-error" class="text-red-400 text-sm hidden"></p>
      <button type="submit" class="btn btn-primary w-full">Activate CRM</button>
    </form>
  </div>

  <script>
    document.getElementById('btn-copy-hw').addEventListener('click', () => {
      const el = document.getElementById('hardware-id');
      el.select();
      navigator.clipboard?.writeText(el.value);
    });

    document.getElementById('activation-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('activation-error');
      errEl.classList.add('hidden');
      const key = document.getElementById('activation-key').value.trim();
      try {
        const res = await fetch('/api/license/activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ activation_key: key }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Activation failed');
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
