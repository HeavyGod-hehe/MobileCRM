# Push Source/VERSION (or click "Run workflow") → builds apps → GitHub Release → updates version.json
# Customer apps read version.json and show "Install update" in Settings.

name: Release CRM Update

on:
  workflow_dispatch:
  push:
    branches: [Version007, main]
    paths:
      - 'Source/VERSION'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  build-mac-arm64:
    name: Build Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r Source/requirements.txt pyinstaller
          python Source/build_customer_mac.py --arch arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: Customer Copy Apple Silicon/
          retention-days: 5

  build-mac-intel:
    name: Build Intel Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Rosetta 2 is available
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta already available"
          else
            softwareupdate --install-rosetta --agree-to-license
            arch -x86_64 /usr/bin/true
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: |
          arch -x86_64 python -m pip install --upgrade pip
          arch -x86_64 python -m pip install --no-cache-dir -r Source/requirements.txt pyinstaller
          arch -x86_64 python Source/build_customer_mac.py --arch x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: mac-intel
          path: Customer Copy Intel Mac/
          retention-days: 5

  build-mac-universal:
    name: Build Universal Mac
    needs: [build-mac-arm64, build-mac-intel]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: artifacts/mac-arm64
      - uses: actions/download-artifact@v4
        with:
          name: mac-intel
          path: artifacts/mac-intel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge arm64 + Intel builds into a universal app
        run: |
          chmod +x "artifacts/mac-arm64/Phone Reseller CRM.app/Contents/MacOS/PhoneResellerCRM"
          chmod +x "artifacts/mac-intel/Phone Reseller CRM.app/Contents/MacOS/PhoneResellerCRM"
          python Source/build_customer_mac.py --arch universal \
            --arm64-app "artifacts/mac-arm64/Phone Reseller CRM.app" \
            --x86-64-app "artifacts/mac-intel/Phone Reseller CRM.app"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-universal
          path: Customer Copy Universal Mac/
          retention-days: 5

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r Source/requirements.txt pyinstaller
          python Source/build_customer_windows_copy.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Customer Windows Copy/
          retention-days: 5

  publish:
    name: Publish release + version.json
    needs: [build-mac-arm64, build-mac-intel, build-mac-universal, build-windows]
    runs-on: ubuntu-latest
    env:
      RELEASES_REPO: HeavyGod-hehe/MobileCRM-releases
    steps:
      - uses: actions/checkout@v4

      # Customer apps fetch version.json from this SEPARATE public repo, not
      # this (private) source repo — see HOW_TO_RELEASE.md for why. Requires
      # a RELEASES_REPO_TOKEN secret with write access to that repo.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          path: releases-repo

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < Source/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Restore executable permissions lost by artifact download
        # actions/download-artifact does not reliably preserve the Unix
        # executable bit on files built on a different runner OS (these Mac
        # binaries were built on macos-latest, downloaded here on
        # ubuntu-latest) — confirmed by actually launching a downloaded
        # release build, which failed to start because its binary had lost
        # +x. Restore it explicitly, right before these get zipped for
        # customers, so it can't silently regress again upstream.
        run: |
          for dir in artifacts/mac-intel artifacts/mac-arm64 artifacts/mac-universal; do
            app="$dir/Phone Reseller CRM.app"
            if [ -d "$app" ]; then
              find "$app" -type f \( -name "PhoneResellerCRM" -o -name "FolderPicker" \) -exec chmod +x {} \;
            fi
            if [ -f "$dir/FolderPicker" ]; then
              chmod +x "$dir/FolderPicker"
            fi
          done

      - name: Package release zips
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cd artifacts/mac-intel
          zip -ry "../../dist/PhoneResellerCRM-IntelMac-${VERSION}.zip" "Phone Reseller CRM.app"
          cd ../mac-arm64
          zip -ry "../../dist/PhoneResellerCRM-AppleSilicon-${VERSION}.zip" "Phone Reseller CRM.app"
          cd ../mac-universal
          zip -ry "../../dist/PhoneResellerCRM-UniversalMac-${VERSION}.zip" "Phone Reseller CRM.app"
          cd ../windows
          zip -ry "../../dist/PhoneResellerCRM-Windows-${VERSION}.zip" "Phone Reseller CRM"
          ls -la ../../dist/

      - name: Create or update GitHub Release (on the public releases repo)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="v${VERSION}"
          NOTES="Phone Reseller CRM ${VERSION}

          Customer apps: open **Settings → Software Update → Install update**.
          Your **Data** folder (database & backups) is not touched."

          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber --repo "$RELEASES_REPO"
            gh release edit "$TAG" --notes "$NOTES" --repo "$RELEASES_REPO"
          else
            gh release create "$TAG" dist/*.zip \
              --title "Phone Reseller CRM ${VERSION}" \
              --notes "$NOTES" \
              --repo "$RELEASES_REPO"
          fi

      - name: Update version.json manifest (in the releases repo)
        run: |
          python Source/scripts/generate_version_manifest.py \
            --version "${{ steps.ver.outputs.version }}" \
            --repo "$RELEASES_REPO" \
            --tag "v${{ steps.ver.outputs.version }}" \
            --output releases-repo/version.json
          cp Source/VERSION releases-repo/VERSION

      - name: Commit manifest to releases repo
        working-directory: releases-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json VERSION
          if git diff --staged --quiet; then
            echo "version.json unchanged"
          else
            git commit -m "chore: update release manifest v${{ steps.ver.outputs.version }}"
            git push
          fi
