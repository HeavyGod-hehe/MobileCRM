name: Build Mac Customer Copy

on:
  workflow_dispatch:
  push:
    branches: [main, MoreFixes-update, 'cursor/**']
    paths:
      - 'Source/**'
      - '.github/workflows/build-mac.yml'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Source/requirements.txt pyinstaller

      - name: Build Customer Copy
        run: python Source/build_customer_copy.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Customer-Copy-Mac
          path: Customer Copy/
          retention-days: 30
