name: Build Mac Customer Copies

on:
  workflow_dispatch:
  push:
    branches: [main, MoreFixes-update, 'cursor/**']
    paths:
      - 'Source/**'
      - '.github/workflows/build-mac.yml'
      - 'Customer Copy Apple Silicon/**'
      - 'Customer Copy Intel Mac/**'
      - 'Customer Copy Universal Mac/**'

jobs:
  build-mac-arm64:
    name: Apple Silicon (M chip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Source/requirements.txt pyinstaller

      - name: Build Customer Copy Apple Silicon
        run: python Source/build_customer_mac.py --arch arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Customer-Copy-Apple-Silicon
          path: Customer Copy Apple Silicon/
          retention-days: 30

  build-mac-intel:
    name: Intel Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta (for x64 Python/tooling)
        run: softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Verify x86_64 Python
        run: |
          arch -x86_64 python -c "import platform, struct; print(platform.machine(), struct.calcsize('P') * 8)"
          file "$(arch -x86_64 python -c 'import sys; print(sys.executable)')"

      - name: Install dependencies (x86_64 wheels only)
        run: |
          arch -x86_64 python -m pip install --upgrade pip
          arch -x86_64 python -m pip install --no-cache-dir --force-reinstall \
            -r Source/requirements.txt pyinstaller

      - name: Verify extension architectures
        run: |
          MARKUPSAFE_SO="$(arch -x86_64 python -c "import markupsafe, pathlib; print(next(pathlib.Path(markupsafe.__file__).parent.glob('_speedups*.so')))")"
          file "$MARKUPSAFE_SO" | grep -q x86_64

      - name: Build Customer Copy Intel Mac
        run: arch -x86_64 python Source/build_customer_mac.py --arch x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Customer-Copy-Intel-Mac
          path: Customer Copy Intel Mac/
          retention-days: 30

  build-mac-universal:
    name: Universal Mac (Intel + Apple Silicon)
    runs-on: macos-latest
    needs: [build-mac-arm64, build-mac-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Download Apple Silicon build
        uses: actions/download-artifact@v4
        with:
          name: Customer-Copy-Apple-Silicon
          path: Customer Copy Apple Silicon

      - name: Download Intel build
        uses: actions/download-artifact@v4
        with:
          name: Customer-Copy-Intel-Mac
          path: Customer Copy Intel Mac

      - name: Merge into universal Customer Copy
        run: |
          python Source/build_customer_universal_mac.py \
            --arm64-dir "Customer Copy Apple Silicon" \
            --intel-dir "Customer Copy Intel Mac"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Customer-Copy-Universal-Mac
          path: Customer Copy Universal Mac/
          retention-days: 30
