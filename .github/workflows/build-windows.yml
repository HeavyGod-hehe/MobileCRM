name: Build Windows Customer Copy

on:
  workflow_dispatch:
  push:
    branches: [main, Version007, MoreFixes-update, 'cursor/**']
    paths:
      - 'Source/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Source/requirements.txt pyinstaller

      - name: Build Customer Windows Copy
        run: python Source/build_customer_windows_copy.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Customer-Windows-Copy
          path: Customer Windows Copy/
          retention-days: 30
